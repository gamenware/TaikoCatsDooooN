name: Discord GitHub Notify

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
    - name: Check webhook secret
      id: webhook
      env:
        DISCORD_WEBHOOK_GITHUB: ${{ secrets.DISCORD_WEBHOOK_GITHUB }}
      run: |
        if [ -n "$DISCORD_WEBHOOK_GITHUB" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build Discord payload
      if: steps.webhook.outputs.present == 'true'
      id: payload
      uses: actions/github-script@v7
      with:
        script: |
          const commits = context.payload.commits || [];
          const branch = context.ref.replace("refs/heads/", "");
          const compareUrl = context.payload.compare;
          const repo = context.repo.repo;
          const owner = context.repo.owner;
          const pusher = context.payload.pusher?.name || context.actor;
          const limit = 10;

          const commitLines = commits.slice(0, limit).map((commit) => {
            const shortSha = commit.id.substring(0, 7);
            const message = (commit.message || "").split("\n")[0];
            const author = commit.author?.name || "unknown";
            return `[\`${shortSha}\`](${commit.url}) ${message} - ${author}`;
          });

          if (commits.length > limit) {
            commitLines.push(`...and ${commits.length - limit} more commit(s)`);
          }

          const payload = {
            username: "GitHub",
            embeds: [
              {
                title: `${owner}/${repo} に push されました`,
                url: compareUrl,
                color: 3447003,
                fields: [
                  {
                    name: "Branch",
                    value: branch,
                    inline: true
                  },
                  {
                    name: "Pusher",
                    value: pusher,
                    inline: true
                  },
                  {
                    name: "Commits",
                    value: commitLines.join("\n") || "No commits"
                  }
                ],
                timestamp: new Date().toISOString()
              }
            ]
          };

          core.setOutput("json", JSON.stringify(payload));

    - name: Send message to Discord
      if: steps.webhook.outputs.present == 'true'
      env:
        DISCORD_WEBHOOK_GITHUB: ${{ secrets.DISCORD_WEBHOOK_GITHUB }}
        DISCORD_PAYLOAD: ${{ steps.payload.outputs.json }}
      run: curl -H "Content-Type: application/json" -d "$DISCORD_PAYLOAD" "$DISCORD_WEBHOOK_GITHUB"
